name: Hop-ETL

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

      execution:
        description: "Select ETL execution"
        required: true
        default: raw_to_replicated
        type: choice
        options:
          - raw_to_replicated
          - replicated_to_unified
          - all
      manage_lifecycle_lock:
        description: "Manage lifecycle lock in this workflow"
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: string
      execution:
        description: "Select ETL execution"
        required: true
        type: string
      manage_lifecycle_lock:
        description: "Manage lifecycle lock in this workflow"
        required: false
        type: boolean
        default: true

      lock_owner:
        description: "Existing lifecycle lock owner"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: hop-etl-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  hop-etl:
    name: Apache Hop ETL Execution
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: ${{ inputs.environment || 'dev' }}

    env:
      AWS_REGION: ap-south-1
      APP_NAME: bpay-etl
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      EXECUTION: ${{ inputs.execution || 'raw_to_replicated' }}

      ECS_CLUSTER_NAME: bpay-etl-ecs-${{ inputs.environment || 'dev' }}
      ECS_SERVICE_NAME: bpay-etl-hop-service-${{ inputs.environment || 'dev' }}
      ECS_CONTAINER_NAME: bpay-etl-hop

      HOP_PROJECT: card-rewards-etl

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # VALIDATE WORKFLOW INPUTS
      # ------------------------------------------------------------

      - name: Validate Workflow Inputs
        shell: bash
        run: |
          set -euo pipefail

          case "${ENVIRONMENT}" in
            dev|staging|prod)
              ;;
            *)
              echo "::error::Unsupported environment: ${ENVIRONMENT}"
              exit 1
              ;;
          esac

          case "${EXECUTION}" in
            raw_to_replicated|replicated_to_unified|all)
              ;;
            *)
              echo "::error::Unsupported ETL execution: ${EXECUTION}"
              exit 1
              ;;
          esac

          echo "Environment: ${ENVIRONMENT}"
          echo "Execution: ${EXECUTION}"

      # ------------------------------------------------------------
      # AWS AUTHENTICATION
      # ------------------------------------------------------------

      - name: Configure AWS Credentials
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::518060119469:role/bpay-etl-githubaction-role
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------
      # VERIFY AWS
      # ------------------------------------------------------------

      - name: Verify AWS Login
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================="
          echo "AWS Identity"
          echo "======================================="

          aws sts get-caller-identity

          echo
          echo "Environment : ${ENVIRONMENT}"
          echo "Execution   : ${EXECUTION}"
          echo "Region      : ${AWS_REGION}"
          echo "Cluster     : ${ECS_CLUSTER_NAME}"
          echo "Service     : ${ECS_SERVICE_NAME}"
          echo "Container   : ${ECS_CONTAINER_NAME}"
          echo "Project     : ${HOP_PROJECT}"
      # ------------------------------------------------------------
      # LIFECYCLE LOCK VALIDATION
      # ------------------------------------------------------------

      - name: Validate Lifecycle Lock
        id: lifecycle-lock
        shell: bash
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          MANAGE_LOCK: ${{ inputs.manage_lifecycle_lock }}
          EXISTING_OWNER: ${{ inputs.lock_owner }}
        run: |
          set -euo pipefail

          if [[ "$MANAGE_LOCK" == "false" ]]; then
            OWNER="$EXISTING_OWNER"

            if [[ -z "$OWNER" ]]; then
              echo "::error::Existing lifecycle lock owner is missing."
              exit 1
            fi

            LOCK_OWNER="$OWNER" \
              scripts/lifecycle-lock.sh renew
          else
            OWNER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            LOCK_OWNER="$OWNER" \
              scripts/lifecycle-lock.sh acquire
          fi

          echo "Lifecycle lock validated for ${ENVIRONMENT}."
          echo "LOCK_OWNER=${OWNER}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # VERIFY ECS CLUSTER
      # ------------------------------------------------------------

      - name: Verify ECS Cluster
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ECS CLUSTER ==="

          aws ecs describe-clusters \
            --clusters "${ECS_CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --query 'clusters[0].{Name:clusterName,Status:status,Running:runningTasksCount}' \
            --output table

      # ------------------------------------------------------------
      # VERIFY ECS SERVICE
      # ------------------------------------------------------------

      - name: Verify ECS Service
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ECS SERVICE ==="

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount,TaskDefinition:taskDefinition}' \
            --output table

      # ------------------------------------------------------------
      # FIND RUNNING HOP TASK
      # ------------------------------------------------------------

      - name: Find Running Hop Task
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FIND RUNNING HOP TASK ==="

          TASK_ARN=$(aws ecs list-tasks \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service-name "${ECS_SERVICE_NAME}" \
            --desired-status RUNNING \
            --region "${AWS_REGION}" \
            --query 'taskArns[0]' \
            --output text)

          if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
            echo "ERROR: No running Hop ECS task found."
            exit 1
          fi

          echo "Running task:"
          echo "${TASK_ARN}"

          echo "TASK_ARN=${TASK_ARN}" >> "${GITHUB_ENV}"

      # ------------------------------------------------------------
      # VERIFY HOP TASK
      # ------------------------------------------------------------
      - name: Verify Hop Task
        shell: bash
        run: |
          set -euo pipefail

          echo "=== HOP ECS TASK ==="

          aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER_NAME}" \
            --tasks "${TASK_ARN}" \
            --region "${AWS_REGION}" \
            --query 'tasks[0].{LastStatus:lastStatus,DesiredStatus:desiredStatus,TaskDefinition:taskDefinition,TaskArn:taskArn,StoppedReason:stoppedReason}' \
            --output table

          TASK_STATUS=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER_NAME}" \
            --tasks "${TASK_ARN}" \
            --region "${AWS_REGION}" \
            --query 'tasks[0].lastStatus' \
            --output text)

          if [[ "${TASK_STATUS}" != "RUNNING" ]]; then
            echo "::error::Hop ECS task is not running. Status: ${TASK_STATUS}"
            exit 1
          fi

          echo "Hop ECS task is running successfully."
      
      # ------------------------------------------------------------
      # EXECUTE SELECTED HOP WORKFLOWS
      # ------------------------------------------------------------

      - name: Execute Apache Hop Workflows
        shell: bash
        run: |
          set -euo pipefail

          run_hop_workflow() {
            local workflow_file="$1"
            local workflow_name="$2"

            echo
            echo "======================================="
            echo "Starting: ${workflow_name}"
            echo "Workflow: ${workflow_file}"
            echo "======================================="

            local remote_command
            remote_command="/bin/bash -lc 'set -euo pipefail; echo ECS_EXEC_OK; /opt/hop/hop-run.sh -j ${HOP_PROJECT} -f ${workflow_file}'"

            script -q -e -c \
              "aws ecs execute-command \
                --cluster '${ECS_CLUSTER_NAME}' \
                --task '${TASK_ARN}' \
                --container '${ECS_CONTAINER_NAME}' \
                --interactive \
                --command \"${remote_command}\" \
                --region '${AWS_REGION}'" /dev/null

            echo
            echo "Completed: ${workflow_name}"
          }

          echo "======================================="
          echo "Apache Hop ETL Execution"
          echo "======================================="
          echo "Environment : ${ENVIRONMENT}"
          echo "Execution   : ${EXECUTION}"
          echo "Task        : ${TASK_ARN}"
          echo "Project     : ${HOP_PROJECT}"
          echo "======================================="

          case "${EXECUTION}" in

            raw_to_replicated)
              run_hop_workflow \
                "/files/workflows/raw_to_replicated.hwf" \
                "RAW to REPLICATED"
              ;;

            replicated_to_unified)
              run_hop_workflow \
                "/files/workflows/replicated_to_unified.hwf" \
                "REPLICATED to UNIFIED"
              ;;

            all)
              echo "Executing complete ETL sequence."

              run_hop_workflow \
                "/files/workflows/raw_to_replicated.hwf" \
                "RAW to REPLICATED"

              run_hop_workflow \
                "/files/workflows/replicated_to_unified.hwf" \
                "REPLICATED to UNIFIED"

              echo
              echo "Complete ETL sequence finished."
              ;;

            *)
              echo "ERROR: Invalid execution selection: ${EXECUTION}"
              exit 1
              ;;
          esac

      # ------------------------------------------------------------
      # VERIFY ECS SERVICE AFTER ETL
      # ------------------------------------------------------------

      - name: Verify Hop Service
        if: ${{ always() && steps.aws-auth.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ECS SERVICE AFTER ETL ==="

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount}' \
            --output table

      # ------------------------------------------------------------
      # SHOW ECS EVENTS ON FAILURE
      # ------------------------------------------------------------

      - name: Show ECS Events
        if: ${{ failure() && steps.aws-auth.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== RECENT ECS EVENTS ==="

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query 'services[0].events[0:10]' \
            --output table

      # ------------------------------------------------------------
      # SUCCESS SUMMARY
      # ------------------------------------------------------------

      - name: ETL Summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================="
          echo "Apache Hop ETL Successful"
          echo "======================================="
          echo "Environment : ${ENVIRONMENT}"
          echo "Execution   : ${EXECUTION}"
          echo "Cluster     : ${ECS_CLUSTER_NAME}"
          echo "Service     : ${ECS_SERVICE_NAME}"
          echo "Task        : ${TASK_ARN}"
          echo "Project     : ${HOP_PROJECT}"
          echo "======================================="
      # ------------------------------------------------------------
      # RELEASE LIFECYCLE LOCK
      # ------------------------------------------------------------

      - name: Release Lifecycle Lock
        if: always() && steps.lifecycle-lock.outcome == 'success' && (github.event_name == 'workflow_dispatch' || inputs.manage_lifecycle_lock == true)
        shell: bash
        env:
          LOCK_OWNER: ${{ env.LOCK_OWNER }}
        run: |
          set -euo pipefail

          scripts/lifecycle-lock.sh release