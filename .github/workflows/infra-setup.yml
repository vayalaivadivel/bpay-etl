name: Infra-Setup

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

      action:
        description: "Choose action"
        required: true
        type: choice
        options:
          - verify
          - plan
          - apply
          - destroy

      manage_lifecycle_lock:
        description: "Manage lifecycle lock in this workflow"
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string

      action:
        description: "Terraform action"
        required: true
        type: string

      manage_lifecycle_lock:
        description: "Manage lifecycle lock in this workflow"
        required: false
        type: boolean
        default: true

      lock_owner:
        description: "Existing lifecycle lock owner"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      # CHECKOUT
      - name: Checkout
        uses: actions/checkout@v4

      # CONFIGURE AWS
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::518060119469:role/bpay-etl-githubaction-role
          aws-region: ap-south-1

      # VERIFY AWS LOGIN
      - name: Verify AWS Login
        run: |
          set -euo pipefail
          echo "===================================="
          echo "GitHub Repository: ${GITHUB_REPOSITORY}"
          echo "GitHub Branch: ${GITHUB_REF_NAME}"
          echo "AWS Identity"
          aws sts get-caller-identity
          echo "===================================="

      # LIFECYCLE LOCK VALIDATION
      - name: Validate Lifecycle Lock
        id: lifecycle-lock
        if: contains(fromJSON('["apply","destroy"]'), inputs.action)
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MANAGE_LOCK: ${{ inputs.manage_lifecycle_lock }}
          EXISTING_OWNER: ${{ inputs.lock_owner }}
        run: |
          set -euo pipefail

          if [[ "$MANAGE_LOCK" == "false" ]]; then
            OWNER="$EXISTING_OWNER"

            if [[ -z "$OWNER" ]]; then
              echo "::error::Existing lifecycle lock owner is missing."
              exit 1
            fi
          else
            OWNER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

          if [[ "$MANAGE_LOCK" == "false" ]]; then
            LOCK_OWNER="$OWNER" \
              ../scripts/lifecycle-lock.sh renew
          else
            LOCK_OWNER="$OWNER" \
              ../scripts/lifecycle-lock.sh acquire
          fi

          echo "Lifecycle lock validated for ${ENVIRONMENT}."
          echo "LOCK_OWNER=${OWNER}" >> "$GITHUB_ENV"

      # VALIDATE INPUTS FOR MANUAL AND REUSABLE EXECUTION
      - name: Validate Workflow Inputs
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.environment }}" in
            dev|staging|prod) ;;
            *) echo "ERROR: Unsupported environment"; exit 1 ;;
          esac

          case "${{ inputs.action }}" in
            verify|plan|apply|destroy) ;;
            *) echo "ERROR: Unsupported Terraform action"; exit 1 ;;
          esac

      # BLOCK PROD DESTROY
      - name: Block Prod Destroy
        if: inputs.action == 'destroy' && inputs.environment == 'prod'
        run: |
          echo "ERROR: Destroy is not allowed for PROD."
          exit 1

      # VERIFY AWS, TERRAFORM BACKEND AND ECR
      - name: Verify Terraform Backend and ECR Access
        if: inputs.action == 'verify'
        run: |
          set -euo pipefail

          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "Checking Terraform state bucket..."
          aws s3api head-bucket \
            --bucket jungle-terraform-bucket

          echo "Checking environment state prefix..."
          aws s3api list-objects-v2 \
            --bucket jungle-terraform-bucket \
            --prefix "bpay-etl/${{ inputs.environment }}/" \
            --max-keys 5

          echo "Checking provider mirror object..."
          aws s3api head-object \
            --bucket jungle-terraform-bucket \
            --key bpay-etl/providers/databricks/terraform-provider-databricks_1.114.2_linux_amd64.zip

          echo "Checking shared ECR repository..."
          aws ecr describe-repositories \
            --repository-names jungle-ecr-images \
            --region ap-south-1

          echo "Checking ECR image-list permission..."
          aws ecr list-images \
            --repository-name jungle-ecr-images \
            --region ap-south-1

          echo "AWS identity, S3 backend, provider mirror and ECR access verified."

      # INSTALL MYSQL CLIENT
      - name: Install MySQL Client
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client || \
            sudo apt-get install -y default-mysql-client
          mysql --version

      # CREATE PEM FILE
      - name: Create EC2 PEM file
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$EC2_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$EC2_PRIVATE_KEY" > bastion-key.pem
          chmod 400 bastion-key.pem

      # PREPARE RENDERED SQL DIRECTORY
      - name: Create rendered SQL directory
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        run: mkdir -p .terraform-rendered/ec2

      # SETUP TERRAFORM
      - name: Setup Terraform
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      # VERIFY TERRAFORM
      - name: Verify Terraform Installation
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        run: terraform version

      # DOWNLOAD DATABRICKS PROVIDER MIRROR
      - name: Download Databricks Provider Mirror
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        shell: bash
        run: |
          set -euo pipefail

          MIRROR_DIR="$RUNNER_TEMP/terraform-mirror"

          PROVIDER_DIR="$MIRROR_DIR/registry.terraform.io/databricks/databricks"

          mkdir -p "$PROVIDER_DIR"

          aws s3 cp \
            s3://jungle-terraform-bucket/bpay-etl/providers/databricks/terraform-provider-databricks_1.114.2_linux_amd64.zip \
            "$PROVIDER_DIR/terraform-provider-databricks_1.114.2_linux_amd64.zip" \
            --region "$AWS_REGION"

          echo "MIRROR_DIR=$MIRROR_DIR" >> "$GITHUB_ENV"

          echo "Databricks provider mirror downloaded successfully."

      # CONFIGURE TERRAFORM PROVIDER MIRROR
      - name: Configure Terraform Provider Mirror
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/terraformrc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$MIRROR_DIR"
              include = ["registry.terraform.io/databricks/databricks"]
            }

            direct {
              exclude = ["registry.terraform.io/databricks/databricks"]
            }
          }
          EOF

          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraformrc" >> "$GITHUB_ENV"

          echo "Terraform filesystem mirror configured."

      # TERRAFORM INIT
      - name: Terraform Init
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        shell: bash
        run: |
          set -euo pipefail

          STATE_KEY="bpay-etl/${{ inputs.environment }}/terraform.tfstate"

          for attempt in 1 2 3 4; do
            echo "Terraform init attempt $attempt"

            if terraform init \
              -input=false \
              -reconfigure \
              -lockfile=readonly \
              -backend-config="key=${STATE_KEY}"; then

              echo "Terraform initialization successful."
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "Terraform initialization failed after 4 attempts."
              exit 1
            fi

            sleep $((attempt * 20))
          done

      # TERRAFORM VALIDATE
      - name: Terraform Validate
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        run: terraform validate

      # TERRAFORM FORMAT CHECK
      - name: Terraform Format Check
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        run: terraform fmt -check -recursive

      # TERRAFORM PLAN
      - name: Terraform Plan
        if: contains(fromJSON('["plan","apply"]'), inputs.action)
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -parallelism=20 \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var="private_key_path=bastion-key.pem" \
            -out=tfplan

      # TERRAFORM DESTROY PLAN
      - name: Terraform Destroy Plan
        if: inputs.action == 'destroy'
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -destroy \
            -parallelism=20 \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var="private_key_path=bastion-key.pem" \
            -out=tfplan

          echo "Destroy plan generated successfully."

      # VERIFY RENDERED SQL
      - name: Verify rendered SQL
        if: contains(fromJSON('["plan","apply","destroy"]'), inputs.action)
        run: |
          set -euo pipefail
          ls -R .terraform-rendered || true

      # TERRAFORM APPLY
      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      # DISPLAY OUTPUTS
      - name: Display Terraform Outputs
        if: inputs.action == 'apply'
        run: |
          set -euo pipefail
          echo "======================================"
          echo "Terraform Outputs"
          echo "======================================"
          terraform output

      # UPDATE AWS PARAMETER STORE
      - name: Update Infrastructure Parameters
        if: inputs.action == 'apply'
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          BASTION_IP=$(terraform output -raw bastion_public_ip)
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)

          aws ssm put-parameter \
            --name "/bpay-etl/${DEPLOY_ENV}/bastion-public-ip" \
            --type String \
            --value "$BASTION_IP" \
            --overwrite \
            --region "$AWS_REGION"

          aws ssm put-parameter \
            --name "/bpay-etl/${DEPLOY_ENV}/rds-endpoint" \
            --type String \
            --value "$RDS_ENDPOINT" \
            --overwrite \
            --region "$AWS_REGION"

          echo "Infrastructure parameters updated successfully."

      # TERRAFORM DESTROY APPLY
      - name: Terraform Destroy Apply
        if: inputs.action == 'destroy'
        shell: bash
        run: |
          set -euo pipefail

          terraform apply \
            -auto-approve \
            tfplan

          echo "Terraform destroy completed successfully."

      # DELETE ENVIRONMENT-SPECIFIC ECR IMAGES
      # KEEP THE SHARED ECR REPOSITORY
      - name: Delete Environment Images from ECR
        if: success() && inputs.action == 'destroy'
        env:
          ECR_REPOSITORY: jungle-ecr-images
          ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning up environment-specific ECR images"
          echo "Repository: ${ECR_REPOSITORY}"
          echo "Environment: ${ENVIRONMENT}"

          for image_tag in \
            "bpay-etl-hop-${ENVIRONMENT}" \
            "bpay-etl-airflow-${ENVIRONMENT}"
          do
            echo "Checking image tag: ${image_tag}"

            existing_tag=$(aws ecr list-images \
              --repository-name "${ECR_REPOSITORY}" \
              --filter tagStatus=TAGGED \
              --query "imageIds[?imageTag=='${image_tag}'].imageTag | [0]" \
              --output text \
              --region "${AWS_REGION}")

            if [[ -z "${existing_tag}" || "${existing_tag}" == "None" ]]; then
              echo "Image tag does not exist; skipping: ${image_tag}"
              continue
            fi

            echo "Deleting image tag: ${image_tag}"

            response=$(aws ecr batch-delete-image \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${image_tag}" \
              --region "${AWS_REGION}" \
              --output json)

            echo "${response}" | jq .

            failure_count=$(echo "${response}" | jq '.failures | length')

            if [[ "${failure_count}" -gt 0 ]]; then
              echo "ERROR: ECR reported failures for ${image_tag}:" >&2
              echo "${response}" | jq '.failures' >&2
              exit 1
            fi

            echo "Successfully deleted image tag: ${image_tag}"
          done

          echo "ECR image cleanup completed."
          echo "Shared repository retained: ${ECR_REPOSITORY}"

      # RELEASE LIFECYCLE LOCK
      - name: Release Lifecycle Lock
        if: always() && inputs.manage_lifecycle_lock == true && contains(fromJSON('["apply","destroy"]'), inputs.action) && steps.lifecycle-lock.outcome == 'success'
        shell: bash
        env:
          LOCK_OWNER: ${{ env.LOCK_OWNER }}
        run: |
          set -euo pipefail
          ../scripts/lifecycle-lock.sh release