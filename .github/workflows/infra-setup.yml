name: Infra-Setup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

      action:
        description: "Choose action"
        required: true
        type: choice
        options:
          - verify
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      #########################################
      # CHECKOUT
      #########################################

      - name: Checkout
        uses: actions/checkout@v4

      #########################################
      # CONFIGURE AWS
      #########################################

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::518060119469:role/bpay-etl-githubaction-role
          aws-region: ap-south-1

      #########################################
      # VERIFY AWS LOGIN
      #########################################

      - name: Verify AWS Login
        run: |
          set -euo pipefail

          echo "===================================="
          echo "GitHub Repository"
          echo "${GITHUB_REPOSITORY}"
          echo
          echo "GitHub Branch"
          echo "${GITHUB_REF_NAME}"
          echo
          echo "AWS Identity"
          aws sts get-caller-identity
          echo "===================================="

      #########################################
      # BLOCK PROD DESTROY EARLY
      #########################################

      - name: Block Prod Destroy
        if: github.event.inputs.action == 'destroy' && github.event.inputs.environment == 'prod'
        run: |
          echo "ERROR: Destroy is not allowed for PROD."
          exit 1

      #########################################
      # VERIFY AWS, TERRAFORM BACKEND AND ECR
      #########################################

      - name: Verify Terraform Backend and ECR Access
        if: github.event.inputs.action == 'verify'
        run: |
          set -euo pipefail

          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "Checking Terraform state bucket..."
          aws s3api head-bucket \
            --bucket jungle-terraform-bucket

          echo "Checking environment state prefix..."
          aws s3api list-objects-v2 \
            --bucket jungle-terraform-bucket \
            --prefix "bpay-etl/${{ github.event.inputs.environment }}/" \
            --max-keys 5

          echo "Checking shared ECR repository..."
          aws ecr describe-repositories \
            --repository-names jungle-ecr-images \
            --region ap-south-1

          echo "Checking ECR image-list permission..."
          aws ecr list-images \
            --repository-name jungle-ecr-images \
            --region ap-south-1

          echo "AWS identity, S3 backend, and ECR access verified."

      #########################################
      # INSTALL MYSQL CLIENT
      #########################################

      - name: Install MySQL Client
        if: contains(fromJSON('["apply","destroy"]'), github.event.inputs.action)
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y mysql-client || \
            sudo apt-get install -y default-mysql-client

          mysql --version

      #########################################
      # CREATE PEM FILE
      #########################################

      - name: Create EC2 PEM file
        if: contains(fromJSON('["apply","destroy"]'), github.event.inputs.action)
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          test -n "$EC2_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$EC2_PRIVATE_KEY" > bastion-key.pem
          chmod 400 bastion-key.pem

      #########################################
      # SETUP TERRAFORM
      #########################################

      - name: Setup Terraform
        if: contains(fromJSON('["apply","destroy"]'), github.event.inputs.action)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      #########################################
      # CREATE RENDERED SQL DIRECTORY
      #########################################

      - name: Create rendered SQL directory
        if: contains(fromJSON('["apply","destroy"]'), github.event.inputs.action)
        run: mkdir -p .terraform-rendered/ec2

      #########################################
      # TERRAFORM INIT
      #########################################

      - name: Terraform Init
        if: contains(fromJSON('["apply","destroy"]'), github.event.inputs.action)
        run: |
          set -euo pipefail

          terraform init \
            -backend-config="key=bpay-etl/${{ github.event.inputs.environment }}/terraform.tfstate"

      #########################################
      # TERRAFORM VALIDATE
      #########################################

      - name: Terraform Validate
        if: contains(fromJSON('["apply","destroy"]'), github.event.inputs.action)
        run: terraform validate

      #########################################
      # TERRAFORM FORMAT CHECK
      #########################################

      - name: Terraform Format Check
        if: contains(fromJSON('["apply","destroy"]'), github.event.inputs.action)
        run: terraform fmt -check

      #########################################
      # TERRAFORM PLAN
      #########################################

      - name: Terraform Plan
        if: contains(fromJSON('["apply","destroy"]'), github.event.inputs.action)
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -parallelism=20 \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars" \
            -var="private_key_path=bastion-key.pem" \
            -out=tfplan

      #########################################
      # VERIFY RENDERED SQL
      #########################################

      - name: Verify rendered SQL
        if: contains(fromJSON('["apply","destroy"]'), github.event.inputs.action)
        run: |
          set -euo pipefail
          ls -R .terraform-rendered || true

      #########################################
      # TERRAFORM APPLY
      #########################################

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      #########################################
      # DISPLAY OUTPUTS
      #########################################

      - name: Display Terraform Outputs
        if: github.event.inputs.action == 'apply'
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Terraform Outputs"
          echo "======================================"

          terraform output

      #########################################
      # TERRAFORM DESTROY
      #########################################

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        shell: bash
        run: |
          set -euo pipefail

          terraform destroy \
            -parallelism=20 \
            -auto-approve \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars" \
            -var="private_key_path=bastion-key.pem"

          echo "Terraform destroy completed successfully."

      #########################################
      # DELETE ENVIRONMENT-SPECIFIC ECR IMAGES
      # KEEP THE SHARED ECR REPOSITORY
      #########################################

      - name: Delete Environment Images from ECR
        if: success() && github.event.inputs.action == 'destroy'
        env:
          AWS_REGION: ap-south-1
          ECR_REPOSITORY: jungle-ecr-images
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Cleaning up environment-specific ECR images"
          echo "Repository: ${ECR_REPOSITORY}"
          echo "Environment: ${ENVIRONMENT}"
          echo "======================================"

          for image_tag in \
            "bpay-etl-hop-${ENVIRONMENT}" \
            "bpay-etl-airflow-${ENVIRONMENT}"
          do
            echo "Checking image tag: ${image_tag}"

            existing_tag=$(aws ecr list-images \
              --repository-name "${ECR_REPOSITORY}" \
              --filter tagStatus=TAGGED \
              --query "imageIds[?imageTag=='${image_tag}'].imageTag | [0]" \
              --output text \
              --region "${AWS_REGION}")

            if [[ -z "${existing_tag}" || "${existing_tag}" == "None" ]]; then
              echo "Image tag does not exist; skipping: ${image_tag}"
              continue
            fi

            echo "Deleting image tag: ${image_tag}"

            response=$(aws ecr batch-delete-image \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${image_tag}" \
              --region "${AWS_REGION}" \
              --output json)

            echo "${response}" | jq .

            failure_count=$(echo "${response}" | jq '.failures | length')

            if [[ "${failure_count}" -gt 0 ]]; then
              echo "ERROR: ECR reported failures for ${image_tag}:" >&2
              echo "${response}" | jq '.failures' >&2
              exit 1
            fi

            echo "Successfully deleted image tag: ${image_tag}"
          done

          echo "======================================"
          echo "ECR image cleanup completed."
          echo "Shared repository retained: ${ECR_REPOSITORY}"
          echo "======================================"