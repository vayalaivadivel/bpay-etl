name: Hop-Deploy

on:
  push:
    branches: [main]
    paths:
      - "hop-orchestration/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: hop-deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  hop-deploy:
    name: Apache Hop ECS Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_REGION: ap-south-1
      APP_NAME: bpay-etl
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

      ECR_REPOSITORY: glorytechsystems-platform-images
      IMAGE_TAG: bpay-etl-hop-${{ github.event.inputs.environment || 'dev' }}

      ECS_CLUSTER_NAME: bpay-etl-ecs-${{ github.event.inputs.environment || 'dev' }}
      ECS_SERVICE_NAME: bpay-etl-hop-service-${{ github.event.inputs.environment || 'dev' }}
      ECS_CONTAINER_NAME: bpay-etl-hop

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # AWS
      # ============================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::986401823783:role/bpay-etl-githubaction-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Login
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================="
          echo "AWS Identity"
          echo "======================================="

          aws sts get-caller-identity

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"

          echo "IMAGE_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo
          echo "Environment : ${ENVIRONMENT}"
          echo "Region      : ${AWS_REGION}"
          echo "Cluster     : ${ECS_CLUSTER_NAME}"
          echo "Service     : ${ECS_SERVICE_NAME}"

      # ============================================================
      # ECR
      # ============================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR Repository
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      # ============================================================
      # ECS
      # ============================================================

      - name: Verify ECS Cluster
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ECS CLUSTER ==="

          aws ecs describe-clusters \
            --clusters "${ECS_CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --query 'clusters[0].{Name:clusterName,Status:status,RunningTasks:runningTasksCount}' \
            --output table

      - name: Verify ECS Service
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ECS SERVICE ==="

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount,TaskDefinition:taskDefinition}' \
            --output table

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Docker Image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================="
          echo "Building Apache Hop Docker Image"
          echo "======================================="

          docker build \
            --pull \
            --no-cache \
            -t "${APP_NAME}:${IMAGE_TAG}" \
            -f hop-orchestration/docker/Dockerfile \
            ./hop-orchestration

      - name: Verify Local Docker Image
        shell: bash
        run: |
          set -euo pipefail

          docker image inspect "${APP_NAME}:${IMAGE_TAG}"

      # ============================================================
      # PUSH IMAGE
      # ============================================================

      - name: Tag Docker Image
        shell: bash
        run: |
          set -euo pipefail

          docker tag \
            "${APP_NAME}:${IMAGE_TAG}" \
            "${IMAGE_URI}"

      - name: Push Docker Image
        shell: bash
        run: |
          set -euo pipefail

          echo "Pushing image:"
          echo "${IMAGE_URI}"

          docker push "${IMAGE_URI}"

      - name: Verify Image
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}" \
            --query 'imageDetails[0].{Digest:imageDigest,Pushed:imagePushedAt,Tags:imageTags}' \
            --output table

      # ============================================================
      # ECS DEPLOYMENT
      # ============================================================

      - name: Restart ECS Service
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================="
          echo "Starting ECS Deployment"
          echo "======================================="

          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_SERVICE_NAME}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

      - name: Wait for ECS Service
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for ECS service to become stable..."

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}"

          echo "ECS service is stable."

      # ============================================================
      # VERIFY RUNNING HOP TASK
      # ============================================================

      - name: Get Running Hop Task
        id: hop-task
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FIND RUNNING HOP TASK ==="

          TASK_ARN=$(aws ecs list-tasks \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service-name "${ECS_SERVICE_NAME}" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text \
            --region "${AWS_REGION}")

          if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
            echo "ERROR: No running Hop ECS task found."
            exit 1
          fi

          echo "Running Hop task:"
          echo "${TASK_ARN}"

          echo "task_arn=${TASK_ARN}" >> "$GITHUB_OUTPUT"

      - name: Verify Hop Container
        shell: bash
        run: |
          set -euo pipefail

          TASK_ARN="${{ steps.hop-task.outputs.task_arn }}"

          echo "=== HOP CONTAINER ==="

          aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER_NAME}" \
            --tasks "${TASK_ARN}" \
            --region "${AWS_REGION}" \
            --query 'tasks[0].containers[].{Name:name,Status:lastStatus,Health:healthStatus,ExitCode:exitCode,Reason:reason}' \
            --output table

      # ============================================================
      # VERIFY HOP SERVER
      # ============================================================

      - name: Verify Hop Server
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================="
          echo "Hop ECS Deployment Verified"
          echo "======================================="

          echo "Environment : ${ENVIRONMENT}"
          echo "Cluster     : ${ECS_CLUSTER_NAME}"
          echo "Service     : ${ECS_SERVICE_NAME}"
          echo "Task        : ${{ steps.hop-task.outputs.task_arn }}"
          echo
          echo "ETL workflow will NOT be executed."
          echo "Use the Hop-ETL workflow to run ETL manually."
          echo "======================================="

      # ============================================================
      # LIST ECS TASKS
      # ============================================================

      - name: List ECS Tasks
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ECS TASKS ==="

          aws ecs list-tasks \
            --cluster "${ECS_CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --desired-status RUNNING

      # ============================================================
      # ECS EVENTS
      # ============================================================

      - name: Show ECS Events
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "=== RECENT ECS EVENTS ==="

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query 'services[0].events[0:10]' \
            --output table

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Docker Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          docker image prune -af

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Deployment Summary
        if: success()
        shell: bash
        run: |
          echo "======================================="
          echo "Apache Hop Deployment Successful"
          echo "======================================="
          echo "Environment : ${ENVIRONMENT}"
          echo "Cluster     : ${ECS_CLUSTER_NAME}"
          echo "Service     : ${ECS_SERVICE_NAME}"
          echo "Container   : ${ECS_CONTAINER_NAME}"
          echo "Task        : ${{ steps.hop-task.outputs.task_arn }}"
          echo "Repository  : ${ECR_REPOSITORY}"
          echo "Image       : ${IMAGE_URI}"
          echo
          echo "ETL         : NOT EXECUTED"
          echo
          echo "Use the Hop-ETL workflow separately for ETL execution."
          echo "======================================="