name: Liquibase-Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'database/liquibase/**'
      - '.github/workflows/liquibase-deploy.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Choose action"
        required: true
        type: choice
        default: update
        options:
          - validate
          - update

permissions:
  contents: read

concurrency:
  group: liquibase-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  liquibase:
    name: Liquibase Execution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

    env:
      DB_NAME: bpaydb
      DB_USERNAME: vadivel
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

      # GitHub Environment Variables
      BASTION_IP: ${{ vars.BASTION_PUBLIC_IP }}
      RDS_ENDPOINT: ${{ vars.RDS_ENDPOINT }}

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # VALIDATE ENVIRONMENT CONFIGURATION
      # ==========================================================

      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          test -n "$BASTION_IP" || {
            echo "::error::BASTION_PUBLIC_IP is not configured."
            exit 1
          }

          test -n "$RDS_ENDPOINT" || {
            echo "::error::RDS_ENDPOINT is not configured."
            exit 1
          }

          echo "Environment: $DEPLOY_ENV"
          echo "Database: $DB_NAME"
          echo "Bastion IP and RDS endpoint are configured."

      # ==========================================================
      # INSTALL REQUIRED TOOLS
      # ==========================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-client mysql-client

          java -version
          mysql --version
          ssh -V

      # ==========================================================
      # CONFIGURE SSH TUNNEL
      # ==========================================================

      - name: Configure SSH tunnel
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$EC2_PRIVATE_KEY"

          printf '%s\n' "$EC2_PRIVATE_KEY" \
            > "$RUNNER_TEMP/bastion.pem"

          chmod 600 "$RUNNER_TEMP/bastion.pem"

          ssh-keygen -y \
            -f "$RUNNER_TEMP/bastion.pem" > /dev/null

          ssh -i "$RUNNER_TEMP/bastion.pem" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -N \
            -L 3307:"${RDS_ENDPOINT}":3306 \
            ubuntu@"${BASTION_IP}" &

          SSH_PID=$!

          echo "$SSH_PID" > "$RUNNER_TEMP/ssh-tunnel.pid"

          echo "SSH tunnel process started."

      # ==========================================================
      # WAIT FOR DATABASE TUNNEL
      # ==========================================================

      - name: Wait for database tunnel
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$DB_PASSWORD"

          for i in $(seq 1 30); do

            if MYSQL_PWD="$DB_PASSWORD" mysql \
              --protocol=TCP \
              -h 127.0.0.1 \
              -P 3307 \
              -u "$DB_USERNAME" \
              "$DB_NAME" \
              -e "SELECT 1;" >/dev/null 2>&1; then

              echo "Database connection is ready."
              exit 0
            fi

            sleep 2
          done

          echo "::error::Could not connect to database."
          exit 1

      # ==========================================================
      # INSTALL LIQUIBASE AND MYSQL DRIVER
      # ==========================================================

      - name: Install Liquibase and MySQL driver
        run: |
          set -euo pipefail

          curl -fsSL \
            https://github.com/liquibase/liquibase/releases/download/v4.31.1/liquibase-4.31.1.tar.gz \
            -o "$RUNNER_TEMP/liquibase.tar.gz"

          mkdir -p "$RUNNER_TEMP/liquibase"

          tar -xzf "$RUNNER_TEMP/liquibase.tar.gz" \
            -C "$RUNNER_TEMP/liquibase"

          test -f hop-orchestration/jdbc/mysql-connector-j-9.4.0.jar

          echo "$RUNNER_TEMP/liquibase" >> "$GITHUB_PATH"

      # ==========================================================
      # VERIFY DATABASE CONNECTION
      # ==========================================================

      - name: Verify database connection
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          MYSQL_PWD="$DB_PASSWORD" mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -P 3307 \
            -u "$DB_USERNAME" \
            "$DB_NAME" \
            -e "SELECT DATABASE() AS database_name;"

      # ==========================================================
      # LIQUIBASE VALIDATE
      # ==========================================================

      - name: Liquibase validate
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'validate'
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          liquibase \
            --defaults-file=database/liquibase/liquibase.properties \
            --classpath=hop-orchestration/jdbc/mysql-connector-j-9.4.0.jar \
            --url="jdbc:mysql://127.0.0.1:3307/${DB_NAME}" \
            --username="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --driver=com.mysql.cj.jdbc.Driver \
            validate

      # ==========================================================
      # LIQUIBASE UPDATE
      # ==========================================================

      - name: Liquibase update
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'update')
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          liquibase \
            --defaults-file=database/liquibase/liquibase.properties \
            --classpath=hop-orchestration/jdbc/mysql-connector-j-9.4.0.jar \
            --url="jdbc:mysql://127.0.0.1:3307/${DB_NAME}" \
            --username="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --driver=com.mysql.cj.jdbc.Driver \
            update

      # ==========================================================
      # VERIFY SOURCE SEED COUNTS
      # ==========================================================

      - name: Verify source seed counts
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'update')
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          MYSQL_PWD="$DB_PASSWORD" mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -P 3307 \
            -u "$DB_USERNAME" \
            "$DB_NAME" \
            -e "
              SELECT 'cardholders' AS table_name, COUNT(*) AS row_count FROM cardholders
              UNION ALL SELECT 'cards', COUNT(*) FROM cards
              UNION ALL SELECT 'merchant_categories', COUNT(*) FROM merchant_categories
              UNION ALL SELECT 'offers', COUNT(*) FROM offers
              UNION ALL SELECT 'campaigns', COUNT(*) FROM campaigns
              UNION ALL SELECT 'transactions', COUNT(*) FROM transactions
              UNION ALL SELECT 'reward_points', COUNT(*) FROM reward_points;
            "

      # ==========================================================
      # CLOSE SSH TUNNEL
      # ==========================================================

      - name: Close SSH tunnel
        if: always()
        run: |
          set +e

          if [ -f "$RUNNER_TEMP/ssh-tunnel.pid" ]; then
            SSH_PID="$(cat "$RUNNER_TEMP/ssh-tunnel.pid")"
            kill "$SSH_PID" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/ssh-tunnel.pid"
          fi

          rm -f "$RUNNER_TEMP/bastion.pem"

          echo "SSH tunnel cleanup completed."
