name: Liquibase-Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'database/liquibase/**'
      - '.github/workflows/liquibase-deploy.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

      action:
        description: "Choose action"
        required: true
        type: choice
        default: update
        options:
          - validate
          - update

      manage_lifecycle_lock:
        description: "Manage lifecycle lock in this workflow"
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: string

      action:
        description: "Choose action"
        required: true
        type: string

      manage_lifecycle_lock:
        description: "Manage lifecycle lock in this workflow"
        required: false
        type: boolean
        default: true

      lock_owner:
        description: "Existing lifecycle lock owner"
        required: false
        type: string
        default: ""

    secrets:
      DB_PASSWORD:
        required: true
      EC2_PRIVATE_KEY:
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: liquibase-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  liquibase:
    name: Liquibase Execution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: ${{ inputs.environment || 'dev' }}

    env:
      DB_NAME: bpaydb
      DB_USERNAME: vadivel
      DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # VALIDATE WORKFLOW INPUTS
      # ==========================================================

      - name: Validate Workflow Inputs
        shell: bash
        run: |
          set -euo pipefail

          case "${DEPLOY_ENV}" in
            dev|staging|prod)
              ;;
            *)
              echo "::error::Unsupported environment: ${DEPLOY_ENV}"
              exit 1
              ;;
          esac

          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            case "${{ inputs.action }}" in
              validate|update)
                ;;
              *)
                echo "::error::Unsupported Liquibase action."
                exit 1
                ;;
            esac
          fi

          echo "Environment: ${DEPLOY_ENV}"
          echo "Database: ${DB_NAME}"
          echo "Event: ${GITHUB_EVENT_NAME}"

      # ==========================================================
      # CONFIGURE AWS CREDENTIALS USING OIDC
      # ==========================================================

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::518060119469:role/bpay-etl-githubaction-role
          aws-region: ap-south-1

      # ==========================================================
      # LIFECYCLE LOCK VALIDATION
      # ==========================================================

      - name: Validate Lifecycle Lock
        id: lifecycle-lock
        if: github.event_name == 'push' || inputs.action == 'update'
        shell: bash
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENV }}
          MANAGE_LOCK: ${{ inputs.manage_lifecycle_lock }}
          EXISTING_OWNER: ${{ inputs.lock_owner }}
        run: |
          set -euo pipefail

          if [[ "$MANAGE_LOCK" == "false" ]]; then
            OWNER="$EXISTING_OWNER"

            if [[ -z "$OWNER" ]]; then
              echo "::error::Existing lifecycle lock owner is missing."
              exit 1
            fi

            LOCK_OWNER="$OWNER" \
              scripts/lifecycle-lock.sh renew
          else
            OWNER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            LOCK_OWNER="$OWNER" \
              scripts/lifecycle-lock.sh acquire
          fi

          echo "Lifecycle lock validated for ${ENVIRONMENT}."
          echo "LOCK_OWNER=${OWNER}" >> "$GITHUB_ENV"

      # ==========================================================
      # RETRIEVE INFRASTRUCTURE PARAMETERS
      # ==========================================================

      - name: Retrieve Infrastructure Parameters
        shell: bash
        run: |
          set -euo pipefail

          echo "Retrieving infrastructure parameters for: $DEPLOY_ENV"

          BASTION_IP=$(aws ssm get-parameter \
            --name "/bpay-etl/${DEPLOY_ENV}/bastion-public-ip" \
            --query "Parameter.Value" \
            --output text \
            --region "$AWS_REGION")

          RDS_ENDPOINT=$(aws ssm get-parameter \
            --name "/bpay-etl/${DEPLOY_ENV}/rds-endpoint" \
            --query "Parameter.Value" \
            --output text \
            --region "$AWS_REGION")

          if [[ -z "$BASTION_IP" || "$BASTION_IP" == "None" ]]; then
            echo "::error::Bastion IP was not found in Parameter Store."
            exit 1
          fi

          if [[ -z "$RDS_ENDPOINT" || "$RDS_ENDPOINT" == "None" ]]; then
            echo "::error::RDS endpoint was not found in Parameter Store."
            exit 1
          fi

          echo "BASTION_IP=$BASTION_IP" >> "$GITHUB_ENV"
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> "$GITHUB_ENV"

          echo "Bastion IP and RDS endpoint retrieved successfully."

      # ==========================================================
      # VALIDATE ENVIRONMENT CONFIGURATION
      # ==========================================================

      - name: Validate deployment configuration
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$BASTION_IP" || {
            echo "::error::Bastion IP is not configured."
            exit 1
          }

          test -n "$RDS_ENDPOINT" || {
            echo "::error::RDS endpoint is not configured."
            exit 1
          }

          test -n "$DB_PASSWORD" || {
            echo "::error::DB_PASSWORD is not configured."
            exit 1
          }

          test -n "$DB_USERNAME" || {
            echo "::error::DB_USERNAME is not configured."
            exit 1
          }

          echo "Environment: $DEPLOY_ENV"
          echo "Database: $DB_NAME"
          echo "Bastion and RDS configuration verified."

      # ==========================================================
      # INSTALL JAVA 21
      # ==========================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================================
      # INSTALL REQUIRED TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            openssh-client \
            mysql-client

          java -version
          mysql --version
          ssh -V

      # ==========================================================
      # INSTALL LIQUIBASE AND MYSQL DRIVER
      # ==========================================================

      - name: Install Liquibase and MySQL driver
        run: |
          set -euo pipefail

          curl -fsSL \
            https://github.com/liquibase/liquibase/releases/download/v4.31.1/liquibase-4.31.1.tar.gz \
            -o "$RUNNER_TEMP/liquibase.tar.gz"

          mkdir -p "$RUNNER_TEMP/liquibase"

          tar -xzf "$RUNNER_TEMP/liquibase.tar.gz" \
            -C "$RUNNER_TEMP/liquibase"

          test -x "$RUNNER_TEMP/liquibase/liquibase"

          test -f hop-orchestration/jdbc/mysql-connector-j-9.4.0.jar

          echo "$RUNNER_TEMP/liquibase" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/liquibase/liquibase" --version

          echo "Liquibase and MySQL JDBC driver verified."

      # ==========================================================
      # CONFIGURE SSH TUNNEL
      # ==========================================================

      - name: Configure SSH tunnel
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          umask 077

          test -n "$EC2_PRIVATE_KEY"

          printf '%s\n' "$EC2_PRIVATE_KEY" \
            > "$RUNNER_TEMP/bastion.pem"

          chmod 600 "$RUNNER_TEMP/bastion.pem"

          ssh-keygen -y \
            -f "$RUNNER_TEMP/bastion.pem" > /dev/null

          ssh -i "$RUNNER_TEMP/bastion.pem" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -N \
            -L 3307:"${RDS_ENDPOINT}":3306 \
            ubuntu@"${BASTION_IP}" &

          SSH_PID=$!

          echo "$SSH_PID" > "$RUNNER_TEMP/ssh-tunnel.pid"

          echo "SSH tunnel started with PID: $SSH_PID"

      # ==========================================================
      # WAIT FOR DATABASE TUNNEL
      # ==========================================================

      - name: Wait for database tunnel
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for _ in $(seq 1 30); do

            SSH_PID="$(cat "$RUNNER_TEMP/ssh-tunnel.pid")"

            if ! kill -0 "$SSH_PID" 2>/dev/null; then
              echo "::error::SSH tunnel process has exited."
              exit 1
            fi

            if MYSQL_PWD="$DB_PASSWORD" mysql \
              --protocol=TCP \
              -h 127.0.0.1 \
              -P 3307 \
              -u "$DB_USERNAME" \
              "$DB_NAME" \
              -e "SELECT 1;" >/dev/null 2>&1; then

              echo "Database connection is ready."
              exit 0
            fi

            sleep 2
          done

          echo "::error::Could not connect to database through SSH tunnel."
          exit 1

      # ==========================================================
      # VERIFY DATABASE CONNECTION
      # ==========================================================

      - name: Verify database connection
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          MYSQL_PWD="$DB_PASSWORD" mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -P 3307 \
            -u "$DB_USERNAME" \
            "$DB_NAME" \
            -e "
              SELECT
                DATABASE() AS database_name,
                CURRENT_USER() AS database_user,
                VERSION() AS mysql_version;
            "

      # ==========================================================
      # LIQUIBASE VALIDATE
      # ==========================================================

      - name: Liquibase validate
        if: ${{ inputs.action == 'validate' }}
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          liquibase \
            --defaults-file=database/liquibase/liquibase.properties \
            --classpath=hop-orchestration/jdbc/mysql-connector-j-9.4.0.jar \
            --url="jdbc:mysql://127.0.0.1:3307/${DB_NAME}" \
            --username="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --driver=com.mysql.cj.jdbc.Driver \
            validate

      # ==========================================================
      # LIQUIBASE UPDATE
      # ==========================================================

      - name: Liquibase update
        if: ${{ github.event_name == 'push' || inputs.action == 'update' }}
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          liquibase \
            --defaults-file=database/liquibase/liquibase.properties \
            --classpath=hop-orchestration/jdbc/mysql-connector-j-9.4.0.jar \
            --url="jdbc:mysql://127.0.0.1:3307/${DB_NAME}" \
            --username="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --driver=com.mysql.cj.jdbc.Driver \
            update

      # ==========================================================
      # VERIFY SOURCE SEED COUNTS
      # ==========================================================

      - name: Verify source seed counts
        if: ${{ github.event_name == 'push' || inputs.action == 'update' }}
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          MYSQL_PWD="$DB_PASSWORD" mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -P 3307 \
            -u "$DB_USERNAME" \
            "$DB_NAME" \
            -e "
              SELECT 'cardholders' AS table_name, COUNT(*) AS row_count FROM cardholders
              UNION ALL SELECT 'cards', COUNT(*) FROM cards
              UNION ALL SELECT 'merchant_categories', COUNT(*) FROM merchant_categories
              UNION ALL SELECT 'offers', COUNT(*) FROM offers
              UNION ALL SELECT 'campaigns', COUNT(*) FROM campaigns
              UNION ALL SELECT 'transactions', COUNT(*) FROM transactions
              UNION ALL SELECT 'reward_points', COUNT(*) FROM reward_points;
            "

      # ==========================================================
      # CLOSE SSH TUNNEL
      # ==========================================================

      - name: Close SSH tunnel
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f "$RUNNER_TEMP/ssh-tunnel.pid" ]; then
            SSH_PID="$(cat "$RUNNER_TEMP/ssh-tunnel.pid")"

            kill "$SSH_PID" 2>/dev/null || true

            rm -f "$RUNNER_TEMP/ssh-tunnel.pid"
          fi

          rm -f "$RUNNER_TEMP/bastion.pem"

          echo "SSH tunnel cleanup completed."

      # ==========================================================
      # RELEASE LIFECYCLE LOCK
      # ==========================================================

      - name: Release Lifecycle Lock
        if: always() && steps.lifecycle-lock.outcome == 'success' && (github.event_name == 'push' || inputs.manage_lifecycle_lock == true)
        shell: bash
        env:
          LOCK_OWNER: ${{ env.LOCK_OWNER }}
        run: |
          set -euo pipefail

          scripts/lifecycle-lock.sh release