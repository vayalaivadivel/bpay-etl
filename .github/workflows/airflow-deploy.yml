name: Airflow-Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'airflow-orchestration/**'

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string
      manage_lifecycle_lock:
        description: "Manage lifecycle lock in this workflow"
        required: false
        type: boolean
        default: true
      lock_owner:
        description: "Existing lifecycle lock owner"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: airflow-deploy-${{ inputs.environment || github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  airflow-deploy:
    name: Apache Airflow ECS Deployment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || github.event.inputs.environment || 'dev' }}
    timeout-minutes: 60

    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: 518060119469

      APP_NAME: bpay-etl
      ENVIRONMENT: ${{ inputs.environment || github.event.inputs.environment || 'dev' }}

      ECR_REPOSITORY: jungle-ecr-images
      IMAGE_TAG: bpay-etl-airflow-${{ inputs.environment || github.event.inputs.environment || 'dev' }}
      IMAGE_URI: 518060119469.dkr.ecr.ap-south-1.amazonaws.com/jungle-ecr-images:bpay-etl-airflow-${{ inputs.environment || github.event.inputs.environment || 'dev' }}

      ECS_CLUSTER_NAME: bpay-etl-ecs-${{ inputs.environment || github.event.inputs.environment || 'dev' }}
      ECS_SERVICE_NAME: bpay-etl-airflow-service-${{ inputs.environment || github.event.inputs.environment || 'dev' }}

    steps:
      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # CONFIGURE AWS
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::518060119469:role/bpay-etl-githubaction-role
          aws-region: ap-south-1

      - name: Verify AWS Login
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # --------------------------------------------------------
      # VERIFY ECS INFRASTRUCTURE BEFORE TAKING THE LOCK
      # --------------------------------------------------------

      - name: Verify ECS Infrastructure
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ECS cluster: ${ECS_CLUSTER_NAME}"
          CLUSTER_STATUS=$(aws ecs describe-clusters \
            --clusters "${ECS_CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --query 'clusters[0].status' \
            --output text)

          if [[ "${CLUSTER_STATUS}" != "ACTIVE" ]]; then
            echo "::error::ECS cluster is not ACTIVE. Status: ${CLUSTER_STATUS}"
            exit 1
          fi

          echo "Checking Airflow ECS service: ${ECS_SERVICE_NAME}"
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query 'services[0].status' \
            --output text)

          if [[ "${SERVICE_STATUS}" != "ACTIVE" ]]; then
            echo "::error::Airflow ECS service is not ACTIVE. Status: ${SERVICE_STATUS}"
            exit 1
          fi

          echo "Airflow ECS cluster and service are ready."

      # --------------------------------------------------------
      # ACQUIRE LIFECYCLE LOCK
      # --------------------------------------------------------

      - name: Validate Lifecycle Lock
        id: lifecycle-lock
        shell: bash
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          MANAGE_LOCK: ${{ inputs.manage_lifecycle_lock }}
          EXISTING_OWNER: ${{ inputs.lock_owner }}
        run: |
          set -euo pipefail

          if [[ -n "${EXISTING_OWNER}" ]]; then
            if [[ "${MANAGE_LOCK}" == "true" ]]; then
              echo "::error::A shared lock owner was supplied, but manage_lifecycle_lock is true."
              exit 1
            fi

            OWNER="${EXISTING_OWNER}"
            LOCK_OWNER="${OWNER}" scripts/lifecycle-lock.sh renew
            echo "owns_lock=false" >> "$GITHUB_OUTPUT"
            echo "Shared Master lifecycle lock renewed."
          else
            if [[ "${MANAGE_LOCK}" == "false" ]]; then
              echo "::error::manage_lifecycle_lock is false, but no shared lock owner was supplied."
              exit 1
            fi

            OWNER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            LOCK_OWNER="${OWNER}" scripts/lifecycle-lock.sh acquire
            echo "owns_lock=true" >> "$GITHUB_OUTPUT"
            echo "Standalone lifecycle lock acquired."
          fi

          echo "LOCK_OWNER=${OWNER}" >> "${GITHUB_ENV}"
          echo "Lifecycle lock validated for ${ENVIRONMENT}."

      # --------------------------------------------------------
      # LOGIN TO ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # BUILD DOCKER IMAGE
      # --------------------------------------------------------

      - name: Build Docker Image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t "bpay-etl-airflow:${IMAGE_TAG}" \
            -f airflow-orchestration/docker/Dockerfile \
            ./airflow-orchestration

      # --------------------------------------------------------
      # TAG DOCKER IMAGE
      # --------------------------------------------------------

      - name: Tag Docker Image
        shell: bash
        run: |
          set -euo pipefail

          docker tag \
            "bpay-etl-airflow:${IMAGE_TAG}" \
            "${IMAGE_URI}"

      # --------------------------------------------------------
      # PUSH IMAGE TO ECR
      # --------------------------------------------------------

      - name: Push Image to ECR
        shell: bash
        run: |
          set -euo pipefail

          docker push "${IMAGE_URI}"

      # --------------------------------------------------------
      # FORCE ECS DEPLOYMENT
      # --------------------------------------------------------

      - name: Restart ECS Service
        shell: bash
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_SERVICE_NAME}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

      # --------------------------------------------------------
      # VERIFY ECS DEPLOYMENT
      # --------------------------------------------------------

      - name: Wait for ECS Deployment Stability
        shell: bash
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}"

      - name: Verify ECS Deployment
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query 'services[0].{
              Status:status,
              Desired:desiredCount,
              Running:runningCount,
              Pending:pendingCount
            }' \
            --output table

          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query 'services[0].desiredCount' \
            --output text)

          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query 'services[0].runningCount' \
            --output text)

          if [[ "${DESIRED_COUNT}" == "None" || "${RUNNING_COUNT}" == "None" || "${DESIRED_COUNT}" -lt 1 || "${RUNNING_COUNT}" -ne "${DESIRED_COUNT}" ]]; then
            echo "::error::Airflow ECS tasks are not healthy. Desired=${DESIRED_COUNT}, Running=${RUNNING_COUNT}"
            exit 1
          fi

          echo "Airflow ECS deployment verified."

      # --------------------------------------------------------
      # RELEASE LIFECYCLE LOCK
      # --------------------------------------------------------

      - name: Release Lifecycle Lock
        if: always() && steps.lifecycle-lock.outcome == 'success' && steps.lifecycle-lock.outputs.owns_lock == 'true'
        shell: bash
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          LOCK_OWNER: ${{ env.LOCK_OWNER }}
          AWS_REGION: ap-south-1
        run: |
          set -euo pipefail

          scripts/lifecycle-lock.sh release
          echo "Lifecycle lock released for ${ENVIRONMENT}."

      # --------------------------------------------------------
      # DEPLOYMENT SUMMARY
      # --------------------------------------------------------

      - name: Deployment Successful
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo "======================================="
          echo "Apache Airflow Deployment Successful"
          echo "======================================="
          echo "Environment: ${ENVIRONMENT}"
          echo "Image URI: ${IMAGE_URI}"
          echo "ECS Cluster: ${ECS_CLUSTER_NAME}"
          echo "ECS Service: ${ECS_SERVICE_NAME}"
          echo "Deployment completed successfully"
          echo "======================================="