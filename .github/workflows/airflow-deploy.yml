
name: Airflow-Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'airflow-orchestration/**'

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: airflow-deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  airflow-deploy:
    name: Apache Airflow ECS Deployment
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    timeout-minutes: 60

    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: 518060119469

      APP_NAME: bpay-etl
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

      ECR_REPOSITORY: jungle-ecr-images
      IMAGE_TAG: bpay-etl-airflow-${{ github.event.inputs.environment || 'dev' }}
      IMAGE_URI: 518060119469.dkr.ecr.ap-south-1.amazonaws.com/jungle-ecr-images:bpay-etl-airflow-${{ github.event.inputs.environment || 'dev' }}

      ECS_CLUSTER_NAME: bpay-etl-ecs-${{ github.event.inputs.environment || 'dev' }}
      ECS_SERVICE_NAME: bpay-etl-airflow-service-${{ github.event.inputs.environment || 'dev' }}

    steps:
      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # CONFIGURE AWS
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::518060119469:role/bpay-etl-githubaction-role
          aws-region: ap-south-1

      - name: Verify AWS Login
        run: aws sts get-caller-identity

      # --------------------------------------------------------
      # ACQUIRE LIFECYCLE LOCK
      # --------------------------------------------------------

      - name: Acquire Lifecycle Lock
        id: lifecycle-lock
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          LOCK_OWNER="$OWNER" \
            scripts/lifecycle-lock.sh acquire

          echo "LOCK_OWNER=${OWNER}" >> "$GITHUB_ENV"

          echo "Lifecycle lock acquired for ${ENVIRONMENT}."

      # --------------------------------------------------------
      # LOGIN TO ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # BUILD DOCKER IMAGE
      # --------------------------------------------------------

      - name: Build Docker Image
        run: |
          set -euo pipefail

          docker build \
            -t bpay-etl-airflow:${IMAGE_TAG} \
            -f airflow-orchestration/docker/Dockerfile \
            ./airflow-orchestration

      # --------------------------------------------------------
      # TAG DOCKER IMAGE
      # --------------------------------------------------------

      - name: Tag Docker Image
        run: |
          set -euo pipefail

          docker tag \
            bpay-etl-airflow:${IMAGE_TAG} \
            ${IMAGE_URI}

      # --------------------------------------------------------
      # PUSH IMAGE TO ECR
      # --------------------------------------------------------

      - name: Push Image to ECR
        run: |
          set -euo pipefail

          docker push "${IMAGE_URI}"

      # --------------------------------------------------------
      # FORCE ECS DEPLOYMENT
      # --------------------------------------------------------

      - name: Restart ECS Service
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_SERVICE_NAME}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

      # --------------------------------------------------------
      # VERIFY ECS DEPLOYMENT
      # --------------------------------------------------------

      - name: Wait for ECS Deployment Stability
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}"

      - name: Verify ECS Deployment
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}"

      # --------------------------------------------------------
      # RELEASE LIFECYCLE LOCK
      # --------------------------------------------------------

      - name: Release Lifecycle Lock
        if: always() && steps.lifecycle-lock.outcome == 'success'
        shell: bash
        env:
          LOCK_OWNER: ${{ env.LOCK_OWNER }}
        run: |
          set -euo pipefail

          scripts/lifecycle-lock.sh release

          echo "Lifecycle lock released for ${ENVIRONMENT}."

      # --------------------------------------------------------
      # DEPLOYMENT SUMMARY
      # --------------------------------------------------------

      - name: Deployment Successful
        if: success()
        run: |
          echo "======================================="
          echo "Apache Airflow Deployment Successful"
          echo "======================================="
          echo "Environment: ${ENVIRONMENT}"
          echo "Image URI: ${IMAGE_URI}"
          echo "ECS Cluster: ${ECS_CLUSTER_NAME}"
          echo "ECS Service: ${ECS_SERVICE_NAME}"
          echo "Deployment completed successfully"
          echo "======================================="